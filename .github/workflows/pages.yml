# Публикует сайт на GitHub Pages и раз в 4 часа обновляет погоду по сетке (папка wx/),
# чтобы приложение получало погоду без VPN — с того же сайта.
name: Сайт и погода

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Погода по сетке
        run: python3 tools/fetch_weather.py
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
